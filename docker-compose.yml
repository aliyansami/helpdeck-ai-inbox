services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpdeck
      POSTGRES_PASSWORD: helpdeck
      POSTGRES_DB: helpdeck
    ports:
      - "5432:5432"
    volumes:
      - helpdeck-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdeck"]
      interval: 5s
      retries: 10

volumes:
  helpdeck-db:
